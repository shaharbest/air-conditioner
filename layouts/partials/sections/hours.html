{{ if hugo.Data.hours.hours }}
<div id="hours" class="strip">
  <div class="container pt-6 pb-6 pt-md-10 pb-md-10">
    <div class="row justify-content-center">
      <div class="col-12 text-center mb-4">
        <h2>Hours</h2>
      </div>
    </div>
    <div class="row justify-content-center">
      <div class="col-12 col-md-6 col-lg-4">
        <table class="table table-borderless w-auto mx-auto">
          <tbody>
            {{ range hugo.Data.hours.hours }}
            <tr>
              <td class="fw-bold pe-4">{{ .day }}</td>
              <td>{{ if .closed }}Closed{{ else }}{{ .opens }} – {{ .closes }}{{ end }}</td>
            </tr>
            {{ end }}
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
{{ end }}
